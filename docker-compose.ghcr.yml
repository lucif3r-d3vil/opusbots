# OpusBots - Deploy-only Compose File (GHCR prebuilt images)
# Use this in Portainer / Dockge / TrueNAS / Proxmox stacks.
#
# Stack environment variables (or .env file):
#   GHCR_OWNER   your GitHub username, e.g. lucif3r-d3vil
#   MEDIA_ROOT   folder on host with Downloads/, Movies/, Music/ (default: /tank)
#   ADMIN_USER, ADMIN_PASS, FLASK_SECRET_KEY   for the config-web login
#   IMAGE_TAG    optional, defaults to "latest"

services:
  opus-bot:
    image: ghcr.io/${GHCR_OWNER}/opusbots-bot:${IMAGE_TAG:-latest}
    container_name: opus-bot
    restart: unless-stopped
    command: ["python", "bots/opus_bot.py"]
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/tank}:/tank
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/config/config.json

  config-web:
    image: ghcr.io/${GHCR_OWNER}/opusbots-config-web:${IMAGE_TAG:-latest}
    container_name: config-web
    restart: unless-stopped
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?set ADMIN_PASS in the stack environment}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in the stack environment}
