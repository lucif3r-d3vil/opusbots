# OpusBots - Build-from-source Compose File
# Builds images locally instead of pulling from GHCR.
#
# MEDIA_ROOT is the folder on your host holding Downloads/, Movies/, and Music/.
# Set it in .env, e.g. MEDIA_ROOT=/tank or MEDIA_ROOT=/mnt/storage.
# Defaults to /tank if not set.

services:
  opus-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: opus-bot
    restart: unless-stopped
    command: ["python", "bots/opus_bot.py"]
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/tank}:/tank
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/config/config.json

  config-web:
    build:
      context: .
      dockerfile: config-web/Dockerfile
    container_name: config-web
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config:/config
      # Docker socket allows restarting the bot container from the web UI.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
